$("t1").onclick=function(){tab(1)};$("t2").onclick=function(){tab(2)};
$("q").oninput=all;$("dt").onchange=byDate;$("prev").onclick=function(){shift(-1)};$("next").onclick=function(){shift(1)};
if(D.length){$("dt").value=D[0].d}chips();all();days();byDate();
</script></body></html>
